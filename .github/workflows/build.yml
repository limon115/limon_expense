name: Flutter Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create project & feed Gradle RAM
      run: |
        flutter create --platforms=android .
        mkdir -p assets/shaders/
        echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G" >> android/gradle.properties

    - name: The God Mode Gradle Patch
      run: |
        echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { if (namespace == null) { namespace project.group }; compileSdkVersion 34; lintOptions { checkReleaseBuilds false; abortOnError false } } } } }" >> android/build.gradle

    - name: Install dependencies
      run: flutter pub get

    - name: Generate Database Schema
      run: flutter pub run build_runner build --delete-conflicting-outputs

    - name: Build APK (Bypass R8/ProGuard Silent Crashes)
      run: flutter build apk --release --no-shrink

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
